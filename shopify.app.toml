# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "9a1c0279c19616291bb601d0c83f6d2d"
name = "tryonaishopfy"
application_url = "https://tryonai-app.vercel.app"
embedded = true

[build]
automatically_update_urls_on_dev = false

[webhooks]
api_version = "2026-07"

# Subscriptions registered on `shopify app deploy`. The `shopify app dev --use-localhost`
# workflow skips registration (it rejects non-public webhook URIs), so leaving these enabled
# in source does not affect local dev - the existing Cloudflare-tunnel-blocked workaround
# still works. Re-test webhook delivery against a real tunnel before App Store submission.

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/webhooks/app/uninstalled"

  [[webhooks.subscriptions]]
  topics = [ "app/scopes_update" ]
  uri = "/webhooks/app/scopes_update"

  [[webhooks.subscriptions]]
  topics = [ "app_subscriptions/update" ]
  uri = "/webhooks/app_subscriptions/update"

  # Commission billing requires Protected Customer Data approval for read_orders.
  [[webhooks.subscriptions]]
  topics = [ "orders/paid" ]
  uri = "/webhooks/orders/paid"
  include_fields = [ "id", "name", "subtotal_price_set", "note_attributes", "financial_status", "test" ]

  [[webhooks.subscriptions]]
  topics = [ "refunds/create" ]
  uri = "/webhooks/refunds/create"

  [webhooks.privacy_compliance]
  customer_data_request_url = "/webhooks/customers/data_request"
  customer_deletion_url = "/webhooks/customers/redact"
  shop_deletion_url = "/webhooks/shop/redact"

[app_proxy]
url = "https://tryonai-app.vercel.app/proxy"
subpath = "tryonai"
prefix = "apps"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
# read_orders requires Protected Customer Data approval before deploy/submission.
scopes = "read_orders"

[auth]
redirect_urls = [ "https://tryonai-app.vercel.app/auth/callback" ]
